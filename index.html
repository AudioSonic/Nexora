<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Nexora</title>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="skills">
                <img src="assets/logos/Nexora_Logo.png" alt="Nexora" id="nexora-logo">
                <span>MEINE SKILLS</span>
                <nav>

                    <div class="skill-list" id="skill-list"></div>

                    <button class="btn btn-add-skill" id="btn-add-skill">+ Neuen Skill hinzufügen</button>
                </nav>
            </div>
            

            <div class="total-progress">
                <span>Gesamtfortschritt</span>

                <div class="total-percentage">
                    <div class="progress-circle" style="--progress: 62%;">
                        <span>62%</span>
                    </div>

                    <span class="total-progress-text">
                        15 von 24 Themen<br>abgeschlossen
                    </span>
                </div>
            </div>
            <div class="sidebar-settings">
                <hr>
                <button class="btn btn-settings">
                    <img src="assets/icons/icon_settings.svg">
                    <span>Einstellungen</span>
                </button>
            </div>
            
            
        </aside>

        <main class="main-content" id="main-content">

        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
